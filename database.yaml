apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-three-tier-app
spec:
  serviceName: database-service
  replicas: 1  # safer for single DB
  selector:
    matchLabels:
      app: database
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: my-backend
          image: mariadb
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "yashpatel017"
            - name: MARIADB_DATABASE
              value: student_db
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
    - port: 3306
      targetPort: 3306