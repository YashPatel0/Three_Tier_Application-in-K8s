apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-deploy
  labels:
    app: easycrud-backend  
spec:
  replicas: 1  
  selector: 
    matchLabels:
      app: easycrud-backend
  template: 
    metadata: 
      labels:
        app: easycrud-backend
    spec: 
      containers:
        - name: backend-container
          image: yashpatel017/backend:1.0
          env: 
            - name: DB_HOST
              value: database-service
            - name: DB_NAME
              value: student_db
            - name: DB_USER
              value: yash 
            - name: DB_PASSWORD
              value: "yashpatel017"
          ports: 
            - containerPort: 8080           
---       
apiVersion: v1 
kind: Service
metadata: 
  name: my-backend-svc
spec: 
  type: NodePort
  selector: 
    app: easycrud-backend
  ports: 
    - port: 8080
      targetPort: 8080
      nodePort: 30808  